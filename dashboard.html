<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dashboard Undangan">
    <title>Dashboard Undangan</title>
    <meta name="theme-color" content="#f8f9fa">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/images/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./assets/images/icon-192x192.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/all.min.css" integrity="sha256-4rTIfo5GQTi/7UJqoyUJQKzxW8VN/YBH31+Cy+vTZj4=" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/admin.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha256-5P1JGBOIxI7FBAvT/mb1fCnI5n/NhQKzNUuW7Hq0fMc=" crossorigin="anonymous"></script>
    <script src="./dist/admin.js"></script>
</head>
<body data-url="https://backend-undangan-swart.vercel.app/">
    <nav class="navbar"><ul>
        <li><button class="nav-link active" onclick="undangan.admin.navbar.buttonNavHome(this)"><i class="fa-solid fa-house"></i></button></li>
        <li><button class="nav-link" onclick="undangan.admin.navbar.buttonNavSetting(this)"><i class="fa-solid fa-gear"></i></button></li>
    </ul></nav>

    <div class="app">
        <aside class="sidebar">
            <div class="brand"><i class="fa-solid fa-leaf"></i>Undangan</div>
            <ul class="nav flex-column nav-pills" role="tablist" style="gap:.3rem">
                <li role="presentation"><button class="nav-link w-100 active" data-bs-toggle="pill" data-bs-target="#pills-home" id="button-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true"><i class="fa-solid fa-house"></i>Home</button></li>
                <li role="presentation"><button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#pills-setting" id="button-setting" type="button" role="tab" aria-controls="pills-setting" aria-selected="false"><i class="fa-solid fa-gear"></i>Setting</button></li>
                <li role="presentation"><button class="nav-link logout w-100" onclick="undangan.admin.logout()" type="button" role="tab" aria-selected="false"><i class="fa-solid fa-right-from-bracket"></i>Logout</button></li>
            </ul>
        </aside>

        <main class="content">
            <div class="topbar">
                <div><small>Welcome back</small><h1 class="font-esthetic" id="dashboard-name"><span class="placeholder-wave"><span class="placeholder col-12 rounded-3" style="width:8rem"></span></span></h1></div>
            </div>

            <div class="tab-content">
                <section class="tab-pane fade show active" id="pills-home" role="tabpanel" tabindex="0">
                    <div class="bar">
                        <h5 class="m-0 fw-semibold">Overview</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success btn-sm rounded-pill px-3" onclick="undangan.admin.download(this)" data-offline-disabled="false" aria-label="Download comment"><i class="fa-solid fa-download me-1"></i>Download</button>
                            <button class="btn btn-outline-auto btn-sm px-3" onclick="undangan.theme.change()" aria-label="Change theme"><i class="fa-solid fa-circle-half-stroke me-1"></i>Theme</button>
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat" style="background:linear-gradient(135deg,#134e3a,#1f7a5a)"><i class="fa-solid fa-comments"></i><p>Comments</p><div class="num" id="count-comment"><span class="placeholder-wave"><span class="placeholder rounded-3" style="width:3rem"></span></span></div></div>
                        <div class="stat" style="background:linear-gradient(135deg,#8a6a24,#c79a42)"><i class="fa-solid fa-circle-check"></i><p>Present</p><div class="num" id="count-present"><span class="placeholder-wave"><span class="placeholder rounded-3" style="width:3rem"></span></span></div></div>
                        <div class="stat" style="background:linear-gradient(135deg,#8c3e28,#c4623f)"><i class="fa-solid fa-circle-xmark"></i><p>Absent</p><div class="num" id="count-absent"><span class="placeholder-wave"><span class="placeholder rounded-3" style="width:3rem"></span></span></div></div>
                        <div class="stat" style="background:linear-gradient(135deg,#3b2e5c,#6a4fa3)"><i class="fa-solid fa-heart"></i><p>Likes</p><div class="num" id="count-like"><span class="placeholder-wave"><span class="placeholder rounded-3" style="width:3rem"></span></span></div></div>
                    </div>
                    <div class="cols">
                        <div class="panel">
                            <div class="d-block" id="comment-form-default">
                                <label for="form-comment" class="lbl"><i class="fa-solid fa-comment"></i>Comment</label>
                                <div class="position-relative">
                                    <button class="btn btn-secondary btn-sm position-absolute bottom-0 end-0 m-1" onclick="undangan.comment.gif.open(undangan.comment.gif.default)" aria-label="button gif" data-offline-disabled="false"><i class="fa-solid fa-photo-film"></i></button>
                                    <textarea dir="auto" class="form-control mb-3" id="form-comment" name="form-comment" rows="3" minlength="1" maxlength="1000" placeholder="Type to comment" data-offline-disabled="false"></textarea>
                                </div>
                            </div>
                            <div class="d-none mb-3" id="gif-form-default"></div>
                            <div class="d-flex justify-content-end"><button onclick="undangan.comment.send(this)" class="btn btn-primary btn-sm rounded-pill px-3" data-offline-disabled="false"><i class="fa-solid fa-paper-plane me-2"></i>Send</button></div>
                        </div>
                        <div>
                            <div class="mb-2" id="comments" data-loading="false"></div>
                            <nav class="d-flex d-none justify-content-center py-3 mb-4" id="pagination"></nav>
                        </div>
                    </div>
                </section>

                <section class="tab-pane fade" id="pills-setting" role="tabpanel" tabindex="0">
                    <div class="bar"><h5 class="m-0 fw-semibold">Settings</h5></div>
                    <div class="cols">
                        <div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-envelope"></i>Email</div><p class="m-0" id="dashboard-email"></p></div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-person"></i>Name</div>
                                <form><input dir="auto" type="text" class="form-control form-control-sm mb-3" id="form-name" minlength="2" maxlength="50" name="form-name" oninput="undangan.admin.enableButtonName()" autocomplete="name" data-offline-disabled="false"></form>
                                <div class="d-flex justify-content-end"><button type="button" class="btn btn-sm btn-primary rounded-pill px-3" id="button-change-name" onclick="undangan.admin.changeName(this)" disabled data-offline-disabled="false">Change</button></div></div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-key"></i>Access Key</div>
                                <div class="input-group input-group-sm mb-3"><input type="text" class="form-control form-control-sm" id="dashboard-accesskey" placeholder="Regenerate key" readonly><button class="btn btn-sm btn-outline-secondary" type="button" data-copy="" onclick="undangan.util.copy(this)" id="button-copy-accesskey"><i class="fa-solid fa-copy"></i></button></div>
                                <div class="d-flex justify-content-end"><button type="button" class="btn btn-sm btn-primary rounded-pill px-3" onclick="undangan.admin.regenerate(this)" data-offline-disabled="false">Regenerate</button></div></div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-location-dot"></i>Time Zone</div>
                                <form><div class="position-relative mb-3"><input type="text" class="form-control form-control-sm" id="form-timezone" oninput="undangan.admin.openLists(this, this.value)" onclick="undangan.admin.openLists(this)" autocomplete="off" data-offline-disabled="false"><div id="dropdown-tz-list" class="d-none list-group position-absolute w-100 shadow-sm overflow-y-scroll z-3" style="max-height:15rem"></div></div></form>
                                <div class="d-flex justify-content-end"><button type="button" class="btn btn-sm btn-primary rounded-pill px-3" id="button-timezone" onclick="undangan.admin.changeTz(this)" disabled data-offline-disabled="false">Change</button></div></div>
                        </div>
                        <div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-photo-film"></i>Tenor Key</div>
                                <div class="input-group input-group-sm mb-3"><input type="text" class="form-control form-control-sm" id="dashboard-tenorkey" placeholder="Api key tenor" autocomplete="off"><button class="btn btn-sm btn-outline-secondary" type="button" onclick="document.getElementById('dashboard-tenorkey').value = null"><i class="fa-solid fa-trash-can"></i></button></div>
                                <div class="d-flex justify-content-end"><button type="button" class="btn btn-sm btn-primary rounded-pill px-3" onclick="undangan.admin.tenor(this)" data-offline-disabled="false">Save</button></div></div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-sliders"></i>Control</div>
                                <div class="form-check form-switch mb-1"><input class="form-check-input" style="cursor:pointer" type="checkbox" role="switch" id="filterBadWord" onchange="undangan.admin.changeCheckboxValue(this, 'filter')" data-offline-disabled="false"><label class="form-check-label" for="filterBadWord">Filter bad word</label></div>
                                <div class="form-check form-switch mb-1"><input class="form-check-input" style="cursor:pointer" type="checkbox" role="switch" id="confettiAnimation" onchange="undangan.admin.changeCheckboxValue(this, 'confetti_animation')" data-offline-disabled="false"><label class="form-check-label" for="confettiAnimation">Confetti animation</label></div>
                                <div class="form-check form-switch mb-1"><input class="form-check-input" style="cursor:pointer" type="checkbox" role="switch" id="replyComment" onchange="undangan.admin.changeCheckboxValue(this, 'can_reply')" data-offline-disabled="false"><label class="form-check-label" for="replyComment">Can reply</label></div>
                                <div class="form-check form-switch mb-1"><input class="form-check-input" style="cursor:pointer" type="checkbox" role="switch" id="editComment" onchange="undangan.admin.changeCheckboxValue(this, 'can_edit')" data-offline-disabled="false"><label class="form-check-label" for="editComment">Can edit</label></div>
                                <div class="form-check form-switch mb-1"><input class="form-check-input" style="cursor:pointer" type="checkbox" role="switch" id="deleteComment" onchange="undangan.admin.changeCheckboxValue(this, 'can_delete')" data-offline-disabled="false"><label class="form-check-label" for="deleteComment">Can delete</label></div></div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-lock"></i>Change Password</div>
                                <form><input hidden type="text" name="username" autocomplete="username" value="...">
                                    <input type="password" class="form-control form-control-sm mb-2" id="old_password" minlength="8" maxlength="20" name="old_password" placeholder="Old Password" autocomplete="current-password" data-offline-disabled="false">
                                    <input type="password" class="form-control form-control-sm mb-3" id="new_password" minlength="8" maxlength="20" name="new_password" oninput="undangan.admin.enableButtonPassword()" placeholder="New Password" autocomplete="new-password" data-offline-disabled="false"></form>
                                <div class="d-flex justify-content-end"><button type="button" class="btn btn-sm btn-primary rounded-pill px-3" id="button-change-password" onclick="undangan.admin.changePassword(this)" disabled data-offline-disabled="false">Change</button></div></div>
                            <div class="panel d-md-none"><button type="button" class="btn btn-danger btn-sm w-100" onclick="undangan.admin.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</button></div>
                            <div class="panel"><div class="lbl"><i class="fa-solid fa-heart"></i>Love Project</div><p class="m-0">Support this project on <i class="fa-brands fa-github me-1"></i><a target="_blank" href="https://github.com/dewanakl/undangan">GitHub</a></p></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal login -->
    <div class="modal fade" id="mainModal" data-bs-backdrop="static" data-bs-keyboard="false" aria-label="modal login" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius:1.2rem"><div class="modal-body p-4">
            <div class="brand justify-content-center" style="padding-bottom:1rem"><i class="fa-solid fa-leaf"></i>Undangan</div>
            <form>
                <div class="mb-3"><label for="loginEmail" class="form-label"><i class="fa-solid fa-envelope me-2"></i>Email</label><input type="email" class="form-control" id="loginEmail" minlength="5" maxlength="254" placeholder="Enter your email" required autocomplete="email" data-offline-disabled="false"></div>
                <div class="mb-3"><label for="loginPassword" class="form-label"><i class="fa-solid fa-lock me-2"></i>Password</label><input type="password" class="form-control" id="loginPassword" minlength="8" maxlength="20" placeholder="Enter your password" required autocomplete="current-password" data-offline-disabled="false"></div>
                <div class="d-grid"><button type="submit" class="btn btn-primary rounded-pill" onclick="undangan.admin.auth.login(this)" data-offline-disabled="false"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</button></div>
            </form>
        </div></div></div>
    </div>
</body>
</html>
